# SAR-402 Path B recording-key credential drop-in — ExecStart= design.
#
# SUPERSEDES systemd/pathb-credential.conf (the ExecStartPre= design),
# which was installed and caused a real ~32-second production outage on
# 2026-07-11 — see
# reports/external-actions/sar-402-path-b-runtime-unlock-service-activation-validation-20260710.md.
# Root cause: $CREDENTIALS_DIRECTORY (populated by LoadCredential=) was
# confirmed NOT visible to ExecStartPre= on this host's systemd 249, only
# to ExecStart=. Do not reintroduce systemd/pathb-credential.conf.
#
# NOT INSTALLED. This file is a reviewable source artifact only. Deploying
# it means copying it to
# /etc/systemd/system/attest-service.service.d/pathb-credential-execstart.conf
# and running `systemctl daemon-reload` — a distinct, separately authorized
# step, not performed by adding this file to the repo. Even once installed,
# activation still requires an attest-service.service restart, which is a
# further separate, explicitly authorized step, per the standing rotation
# approval artifact.
#
# Design: ExecStart= is overridden (the empty `ExecStart=` line clears the
# base unit's value, per systemd drop-in semantics; the FIRST directive in
# this file's [Service] section must be that empty line to actually clear
# it, before this file's own ExecStart= is set) to point at
# pathb-recording-key-unlock-execstart-wrapper.sh instead of directly at
# start.sh. The wrapper attempts the Path B unlock, then unconditionally
# `exec`s the real start.sh — so this process, not a helper ExecStartPre=
# process, is the one systemd tracks as $MAINPID, and LoadCredential='s
# $CREDENTIALS_DIRECTORY is available to it directly.
#
# LoadCredential= sources are root:root, mode 600, unchanged from the
# existing custody ceremony. This host runs systemd 249 (no systemd-creds),
# so plain LoadCredential= is used rather than LoadCredentialEncrypted=
# (systemd >=250); both source files remain GPG-encrypted/
# passphrase-protected at rest regardless.
#
# RuntimeDirectory= provides a writable, tmpfs-backed scratch/output
# location ($CREDENTIALS_DIRECTORY itself is read-only) for the wrapper's
# decrypt work and the final decrypted seed, torn down when the unit stops.
#
# PATH_B_RECORDING_KID is required by the wrapper's own unlock_pathb()
# check and is NOT wired into the live producer (EXPECTED_KID, still -1)
# or the live verifier (SAR402_RECORDING_PUBLIC_KEY_HEX, still -1's key) —
# it only lets the still-dormant credential-lane path complete its own
# internal check. Unlike the rejected ExecStartPre= design, a failure here
# is non-fatal by construction (see the wrapper script itself): the wrapper
# always execs the real start command regardless of unlock outcome, so a
# misconfiguration of this drop-in degrades to "Path B unavailable," never
# to "attest-service itself won't start."

[Service]
ExecStart=
ExecStart=/usr/local/bin/pathb-recording-key-unlock-execstart-wrapper.sh
LoadCredential=path-b-recording-key-sealed:/root/default-settlement-key-custody/path-b-recording/20260708/pathb-recording-key-defaultverifier-recording-ed25519-2-20260708.tar.gz.gpg
LoadCredential=path-b-recording-passphrase:/root/default-settlement-key-custody/path-b-recording-passphrase/20260708.passphrase
RuntimeDirectory=attest-service-pathb
RuntimeDirectoryMode=0700
Environment=PATH_B_RECORDING_KID=defaultverifier-recording-ed25519-2
