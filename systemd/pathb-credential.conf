# SAR-402 Path B recording-key credential drop-in.
#
# Design record: reports/approvals/sar-402-path-b-runtime-passphrase-delivery-decision-20260710.md
# Implementation plan: reports/strategy/sar-402-path-b-runtime-unlock-implementation-plan-20260710.md
#
# NOT INSTALLED. This file is a reviewable source artifact only. Deploying it
# means copying it to
# /etc/systemd/system/attest-service.service.d/pathb-credential.conf
# and running `systemctl daemon-reload` — a distinct, separately authorized
# step, not performed by adding this file to the repo.
#
# Both LoadCredential= sources are root:root, mode 600, unchanged from the
# existing custody ceremony. systemd copies each into a unit-scoped, tmpfs
# $CREDENTIALS_DIRECTORY (mode 0700, files mode 0400) before ExecStartPre
# runs; neither secret is placed in this unit's environment, in
# /etc/default/attest-service, or in any other shared or persistent surface.
#
# This host runs systemd 249 (no systemd-creds), so plain LoadCredential= is
# used rather than LoadCredentialEncrypted= (systemd >=250). Both source
# files remain GPG-encrypted/passphrase-protected at rest regardless; this
# directive only changes how the encrypted bytes reach the unit.
#
# $CREDENTIALS_DIRECTORY is mounted read-only by systemd (confirmed by live
# validation, 2026-07-10) — the decrypt helper cannot write its output there.
# RuntimeDirectory= provides a separate, writable, tmpfs-backed directory
# (/run/attest-service-pathb, torn down when the unit stops) for the
# helper's scratch work and its final decrypted-seed output.
# PATH_B_RECORDING_PRIVATE_KEY_FILE is an explicit, non-secret path pointing
# sar402_pathb_credential.py at that output file directly, rather than
# relying on its $CREDENTIALS_DIRECTORY auto-resolution fallback (which
# assumes the credential is already in its final form at load time — true
# for a plain LoadCredential=, not true here since a decrypt step runs
# first).
#
# PATH_B_RECORDING_KID is required by the unlock helper's own fail-closed
# check (it refuses to decrypt anything if unset) and is NOT wired into the
# live producer (scripts/sar402_pathb_wrap_receipt.py's EXPECTED_KID, still
# hardcoded to -1) or the live verifier (SAR402_RECORDING_PUBLIC_KEY_HEX in
# /etc/default/attest-service, still -1's key) — setting it here only lets
# the still-dormant credential-lane module populate its own output
# correctly; it does not change what the producer signs with or what the
# verifier trusts. Without this line, ExecStartPre fails on every service
# start (unprefixed, so it aborts the whole unit) — caught during live
# activation validation, 2026-07-10/11.

[Service]
LoadCredential=path-b-recording-key-sealed:/root/default-settlement-key-custody/path-b-recording/20260708/pathb-recording-key-defaultverifier-recording-ed25519-2-20260708.tar.gz.gpg
LoadCredential=path-b-recording-passphrase:/root/default-settlement-key-custody/path-b-recording-passphrase/20260708.passphrase
RuntimeDirectory=attest-service-pathb
RuntimeDirectoryMode=0700
Environment=PATH_B_RECORDING_PRIVATE_KEY_FILE=/run/attest-service-pathb/path-b-recording-signing-key
Environment=PATH_B_RECORDING_KID=defaultverifier-recording-ed25519-2
ExecStartPre=/usr/local/bin/pathb-recording-key-unlock.sh
